<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade - CocoRoot</title>
    <link rel="stylesheet" href="../css/cocoroot.css?v=20260510">
</head>

<body class="app-page cr-sheet">
    <div class="page-content">
        <section class="community-shell">

            <div class="community-head">
                <div class="community-head-row">
                    <div class="community-head-text">
                        <div class="community-title">Comunidade</div>
                        <div class="community-subtitle">Partilha experiências, tira dúvidas e aprende com outros
                            agricultores</div>
                    </div>
                    <button id="publish-toggle-btn" class="btn community-compose-btn cr-tooltip cr-tt-publicar"
                        type="button">
                        <span>Nova publicação</span>
                    </button>
                </div>
                <div class="community-divider"></div>
            </div>

            <div id="community-error" class="dash-card" style="margin-bottom:16px;color:#8a1f11;" hidden></div>

            <div id="publish-form-section" style="margin-bottom:20px;" hidden>
                <div class="community-compose-card">
                    <div class="community-compose-header">
                        <span class="community-compose-title">Nova Publicação</span>
                    </div>
                    <div id="publish-error" class="community-compose-error" hidden></div>
                    <form id="community-publish-form">
                        <div class="form-group">
                            <label for="publish-titulo">Título</label>
                            <input type="text" id="publish-titulo"
                                placeholder="Ex: Como evitar fungos no morango em fibra de coco?" required>
                        </div>
                        <div class="form-group">
                            <label for="publish-conteudo">Conteúdo</label>
                            <textarea id="publish-conteudo" rows="4"
                                placeholder="Partilha a tua experiência, dúvida ou dica com a comunidade..."
                                style="resize:vertical;width:100%;box-sizing:border-box;"></textarea>
                        </div>
                        <div class="community-compose-footer">
                            <div class="community-compose-cat-row">
                                <span class="community-compose-cat-label">Categoria:</span>
                                <select id="publish-categoria" class="community-cat-select">
                                    <option value="duvidas">Dúvida</option>
                                    <option value="dicas">Dica</option>
                                    <option value="experiencias">Experiência</option>
                                </select>
                            </div>
                            <div class="community-compose-actions">
                                <span id="publish-char-counter" class="publish-char-counter">0 / 1200</span>
                                <button type="button" id="publish-cancel-btn" class="btn outline sm">Cancelar</button>
                                <button type="submit" id="publish-submit-btn" class="btn sm">Publicar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="community-stats" class="community-stats-strip" aria-label="Estatísticas da comunidade"></div>

            <div class="community-toolbar">
                <div class="community-search-wrap">
                    <input type="search" id="community-search" class="community-search-input"
                        placeholder="Pesquisar publicações...">
                </div>
                <div class="community-sort-btns" role="group" aria-label="Ordenar por">
                    <button class="sort-pill active" type="button" data-sort="recentes">Recentes</button>
                    <button class="sort-pill" type="button" data-sort="populares">Populares</button>
                    <button class="sort-pill" type="button" data-sort="sem-resposta">Sem resposta</button>
                </div>
            </div>

            <div class="tabs community-tabs" role="tablist" aria-label="Categorias">
                <button class="tab active" type="button" data-cat="todos">Todos</button>
                <button class="tab tab-duvidas" type="button" data-cat="duvidas">Dúvidas</button>
                <button class="tab tab-dicas" type="button" data-cat="dicas">Dicas</button>
                <button class="tab tab-experiencias" type="button" data-cat="experiencias">Experiências</button>
            </div>

            <div id="posts" class="community-posts"></div>

        </section>
    </div>

    <script src="../js/utils/config.js"></script>
    <script src="../js/utils/api.js"></script>
    <script src="../js/controllers/comunidade.js"></script>
    <script src="../js/views/layout.js"></script>
</body>

</html>
