<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Artigo - CocoRoot</title>
    <link rel="stylesheet" href="../css/cocoroot.css">
</head>

<body class="app-page">
    <div class="page-content news-detail-page">
        <section class="news-shell">
            <div class="news-head">
                <div class="news-title">Notícias e Artigos</div>
                <div class="news-subtitle">Mantenha-se atualizado com dicas e histórias da comunidade</div>
                <div class="news-divider"></div>
            </div>

            <div class="news-detail-titlebar">
                <h1 id="post-title" class="news-detail-title">Como Maximizar a Produção de Morangos em Fibra de Coco
                </h1>
                <div class="detalhe-actions">
                    <div class="article-heart" id="post-share" aria-label="Partilhar">
                        <button type="button" aria-label="Partilhar"><i class="bi bi-share"
                                aria-hidden="true"></i></button>
                    </div>
                    <div class="article-heart" id="post-like" aria-label="Adicionar aos favoritos">
                        <button type="button" aria-label="Favoritar"><i class="bi bi-heart"
                                aria-hidden="true"></i></button>
                    </div>
                </div>
            </div>

            <div class="detalhe-img img-ph"></div>

            <div class="news-detail-body">
                <div id="post-body" class="news-article-copy"></div>
                <a href="noticias.html" class="news-more">Voltar às notícias</a>
            </div>
        </section>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || '1';
            const data = {
                '1': {
                    title: 'Como Maximizar a Produção de Morangos em Fibra de Coco',
                    img: '../image/planta-1024w.jpeg',
                    body: [
                        'A fibra de coco é um substrato muito estável para morango: retém água, mantém boa oxigenação e permite rega frequente com controlo. A diferença aparece quando existe rotina: pH e EC consistentes, drenagem correta e uma fertirrega ajustada à fase da planta.',
                        'Para começar bem, use coco lavado e, se possível, tamponado (buffered). No arranque, o coco pode “segurar” cálcio e magnésio, por isso faz sentido trabalhar com uma solução completa que inclua Ca/Mg.',
                        'Na prática, o que mais melhora a produção é rega em pulsos com algum escoamento (runoff). Isto ajuda a evitar acumulação de sais, mantém o substrato mais homogéneo e reduz stress na planta.',
                        'No CocoRoot, registe a rotina (horários, pH/EC, notas) e ajuste com base no que vê no escoamento e no comportamento das folhas. Pequenos ajustes semanais costumam valer mais do que mudanças grandes e raras.'
                    ]
                },
                '2': {
                    title: 'Novidades: Sistema de Monitorização Automática Disponível',
                    img: '../image/Coco-1024w.jpeg',
                    body: [
                        'A CocoRoot lança um sistema de monitorização automática pensado para acompanhar humidade, temperatura e comportamento do substrato ao longo do dia.',
                        'Com alertas em tempo real e uma visão rápida do estado das parcelas, fica mais simples reagir cedo e reduzir desperdício de água e nutrientes.',
                        'A ideia é transformar dados em decisões rápidas: identificar padrões de rega, detetar desvios e manter o cultivo mais previsível.'
                    ]
                },
                '3': {
                    title: 'História de Sucesso: Agricultor Duplica Produção em 6 Meses',
                    img: '../image/planta-1024w.jpeg',
                    body: [
                        'Pedro Costa começou com uma pequena área experimental e, ao ajustar drenagem, plano de rega e rotina de acompanhamento, conseguiu duplicar a produção em seis meses.',
                        'A mudança principal foi a consistência: regas curtas e frequentes, controlo de pH/EC e atenção ao escoamento para evitar sais acumulados.',
                        'O caso mostra como pequenas melhorias operacionais, apoiadas por dados, podem tornar a exploração mais estável e rentável.'
                    ]
                },
                '4': {
                    title: 'Preparação do Substrato: Erros Comuns e Como Evitá-los',
                    img: '../image/Coco-1024w.jpeg',
                    body: [
                        'A preparação do substrato é uma das etapas mais críticas no arranque do cultivo em fibra de coco. Erros simples comprometem o desenvolvimento logo nas primeiras semanas.',
                        'Os mais comuns: hidratar mal (zonas secas), pouca drenagem, não lavar quando necessário e ignorar o tamponamento (Ca/Mg) em coco não preparado.',
                        'Com um processo simples — hidratar, lavar/escorrer, estabilizar pH/EC e evitar compactar — o cultivo fica mais previsível e uniforme.'
                    ]
                },
                '5': {
                    title: 'Comunidade CocoRoot Recebe Novos Guias Interativos',
                    img: '../image/planta-1024w.jpeg',
                    body: [
                        'Os novos guias interativos da CocoRoot foram feitos para simplificar tarefas e apoiar produtores em diferentes fases de aprendizagem.',
                        'O objetivo é um percurso prático e fácil de seguir, com passos claros e recomendações aplicáveis ao dia a dia de quem cultiva em fibra de coco.',
                        'Os módulos ajudam a começar com o básico (substrato, pH/EC, rega e manutenção) e a evoluir com consistência.'
                    ]
                }
            };
            const post = data[id] || data['1'];
            document.getElementById('post-title').textContent = post.title;
            document.title = post.title + ' - CocoRoot';

            const img = document.querySelector('.detalhe-img');
            if (img) {
                img.innerHTML = `<img src="${post.img}" width="980" height="420" loading="eager" decoding="async" style="width:100%;height:100%;object-fit:cover;" alt="${post.title}">`;
            }

            const bodyRoot = document.getElementById('post-body');
            if (bodyRoot) {
                bodyRoot.innerHTML = '';
                const parts = Array.isArray(post.body)
                    ? post.body
                    : String(post.body || '').split(/\n\s*\n/g);
                parts.map((p) => String(p || '').trim()).filter(Boolean).forEach((p) => {
                    const el = document.createElement('p');
                    el.textContent = p;
                    bodyRoot.appendChild(el);
                });
            }

            const key = 'cocoRootFavorites';
            const read = () => {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : [];
                } catch {
                    return [];
                }
            };
            const write = (list) => localStorage.setItem(key, JSON.stringify(list || []));
            const favorites = new Set(read().map(String));

            const likeRoot = document.getElementById('post-like');
            const shareRoot = document.getElementById('post-share');
            const likeIcon = likeRoot ? likeRoot.querySelector('i') : null;

            const syncLike = () => {
                const liked = favorites.has(String(id));
                if (likeRoot) likeRoot.classList.toggle('is-liked', liked);
                if (likeIcon) likeIcon.className = liked ? 'bi bi-heart-fill' : 'bi bi-heart';
                if (likeRoot) likeRoot.setAttribute('aria-label', liked ? 'Remover dos favoritos' : 'Adicionar aos favoritos');
            };
            syncLike();

            if (likeRoot) {
                likeRoot.addEventListener('click', (e) => {
                    e.preventDefault();
                    const k = String(id);
                    if (favorites.has(k)) {
                        favorites.delete(k);
                        window.CocoRootToast && window.CocoRootToast('Favoritos', 'Removido dos favoritos');
                    } else {
                        favorites.add(k);
                        window.CocoRootToast && window.CocoRootToast('Favoritos', 'Adicionado aos favoritos');
                    }
                    write(Array.from(favorites));
                    syncLike();
                });
            }

            if (shareRoot) {
                const shareBtn = shareRoot.querySelector('button');
                (shareBtn || shareRoot).addEventListener('click', async (e) => {
                    e.preventDefault();
                    const url = window.location.href;
                    try {
                        if (navigator.share) {
                            await navigator.share({ title: post.title, url });
                        } else if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(url);
                            window.CocoRootToast && window.CocoRootToast('Partilha', 'Link copiado');
                        } else {
                            window.CocoRootToast && window.CocoRootToast('Partilha', 'Não foi possível partilhar');
                        }
                    } catch {
                        window.CocoRootToast && window.CocoRootToast('Partilha', 'Não foi possível partilhar');
                    }
                });
            }
        })();
    </script>
    <script src="../js/views/layout.js"></script>
</body>

</html>
